# Sirve la versión compilada del frontend en el despliegue (compose.prod.yaml).
# Escucha en 5173 para que el gateway use la misma ruta que en desarrollo.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de la SPA (por ejemplo /peak) se resuelven en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan hash en el nombre y pueden cachearse.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
