name: ${COMPOSE_PROJECT_NAME:-labsentinel}

services:
  # Genera una CA y certificados de desarrollo dentro de un volumen Docker.
  # Las claves no se versionan ni se escriben en el árbol del repositorio.
  tls-init:
    image: python:3.11-slim
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        if [ ! -s /certs/localhost.key ] || [ ! -s /certs/localhost.crt ] || [ ! -s /certs/labsentinel-local-ca.crt ]; then
          rm -f /certs/localhost.key /certs/localhost.crt /certs/labsentinel-local-ca.key /certs/labsentinel-local-ca.crt /certs/localhost.csr
          openssl genrsa -out /certs/labsentinel-local-ca.key 4096
          openssl req -x509 -new -nodes -key /certs/labsentinel-local-ca.key -sha256 -days 825 \
            -subj '/CN=LabSentinel Local Development CA' -out /certs/labsentinel-local-ca.crt
          openssl genrsa -out /certs/localhost.key 2048
          openssl req -new -key /certs/localhost.key -subj '/CN=localhost' -out /certs/localhost.csr
          printf 'subjectAltName=DNS:localhost,DNS:keycloak,IP:127.0.0.1,IP:::1\n' > /tmp/localhost.ext
          openssl x509 -req -in /certs/localhost.csr -CA /certs/labsentinel-local-ca.crt -CAkey /certs/labsentinel-local-ca.key \
            -CAcreateserial -out /certs/localhost.crt -days 825 -sha256 -extfile /tmp/localhost.ext
          rm -f /certs/localhost.csr /certs/labsentinel-local-ca.srl /tmp/localhost.ext
        fi
        # Keycloak no se ejecuta como root. La clave queda legible solo para
        # root y el UID de Keycloak; el certificado y la CA sí son públicos.
        chown 1000:0 /certs/localhost.key /certs/localhost.crt
        chmod 640 /certs/localhost.key
        chmod 644 /certs/localhost.crt /certs/labsentinel-local-ca.crt
    volumes:
      - tls_certificates:/certs
    network_mode: none
    restart: "no"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init/01-create-keycloak-database.sh:/docker-entrypoint-initdb.d/01-create-keycloak-database.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  database-migrations:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
    command:
      [
        "/bin/sh",
        "-ec",
        "for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -f \"$$migration\"; done",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: >
      start-dev --import-realm
      --https-certificate-file=/opt/keycloak/conf/tls/localhost.crt
      --https-certificate-key-file=/opt/keycloak/conf/tls/localhost.key
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Conserva un emisor estable en los tokens aun cuando auth-service use la
      # red interna para consultar JWKS y canjear el código.
      KC_HOSTNAME: ${KEYCLOAK_URL_PUBLIC:-https://localhost:8081}
    ports:
      - "${KEYCLOAK_PORT}:8443"
    volumes:
      - ./infra/keycloak/realm-labsentinel.json:/opt/keycloak/data/import/realm-labsentinel.json:ro
      - tls_certificates:/opt/keycloak/conf/tls:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [backend, frontend]
    restart: unless-stopped

  # Sincroniza las URL HTTPS del cliente aunque el realm ya exista en la BD.
  keycloak-client-config:
    image: python:3.11-slim
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_URL_INTERNAL: ${KEYCLOAK_URL_INTERNAL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-labsentinel}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-labsentinel-web}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-https://localhost:8080/api/auth/keycloak/callback}
      KEYCLOAK_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL:-https://localhost:8080/}
    volumes:
      - ./infra/keycloak/configure-client.py:/scripts/configure-client.py:ro
    command: ["python", "/scripts/configure-client.py"]
    depends_on:
      keycloak:
        condition: service_started
    networks: [backend]
    restart: "no"

  frontend:
    build:
      context: ./apps/frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_PROXY_API_TARGET: http://gateway
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
      VITE_KEYCLOAK_ENABLED: ${VITE_KEYCLOAK_ENABLED:-false}
      # Mantiene el ritmo de actualización visual alineado al simulador.
      VITE_SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-15}
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [frontend]

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "${GATEWAY_PORT}:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - tls_certificates:/etc/nginx/tls:ro
    depends_on:
      tls-init:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      auth-service:
        condition: service_healthy
      device-service:
        condition: service_started
      telemetry-service:
        condition: service_started
      alert-ticket-service:
        condition: service_started
      report-service:
        condition: service_started
    networks: [frontend, backend]
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      LOCAL_PASSWORD_LOGIN_ENABLED: ${LOCAL_PASSWORD_LOGIN_ENABLED}
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      KEYCLOAK_URL_INTERNAL: ${KEYCLOAK_URL_INTERNAL:-http://keycloak:8080}
      KEYCLOAK_URL_PUBLIC: ${KEYCLOAK_URL_PUBLIC:-https://localhost:8081}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-labsentinel}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-labsentinel-web}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI:-https://localhost:8080/api/auth/keycloak/callback}
      KEYCLOAK_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL:-https://localhost:8080/}
    depends_on:
      database-migrations:
        condition: service_completed_successfully
      keycloak-client-config:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [backend, frontend]
    restart: unless-stopped

  device-service:
    build: ./services/device-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: device-service
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEVICE_IMAGES_PATH: /data/device-images
    volumes:
      - device_images:/data/device-images
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  telemetry-service:
    build: ./services/telemetry-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: telemetry-service
      ROOT_PATH: /api/telemetry
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_RECIPIENTS: ${ALERT_EMAIL_RECIPIENTS:-}
      DEVICE_IMAGES_PATH: /data/device-images
    volumes:
      - device_images:/data/device-images:ro
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Mantiene acceso a PostgreSQL por la red privada y habilita solamente este
    # servicio para entregar alertas SMTP al proveedor configurado.
    networks: [backend, outbound]
    restart: unless-stopped

  alert-ticket-service:
    build: ./services/alert-ticket-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: alert-ticket-service
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TICKET_ATTACHMENTS_PATH: /data/ticket-attachments
    volumes:
      - ticket_attachments:/data/ticket-attachments
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    networks: [backend]
    restart: unless-stopped

  report-service:
    build: ./services/report-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: report-service
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    networks: [backend]
    restart: unless-stopped

  simulator-device:
    build: ./services/simulator-device
    environment:
      APP_ENV: ${APP_ENV}
      TELEMETRY_URL: http://telemetry-service:8000
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-15}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_RARE_PEAK_PROBABILITY: ${SIMULATOR_RARE_PEAK_PROBABILITY:-0.00005}
    depends_on:
      telemetry-service:
        condition: service_healthy
    networks: [backend]

networks:
  frontend:
  backend:
    internal: true
  outbound:

volumes:
  postgres_data:
  frontend_node_modules:
  device_images:
  ticket_attachments:
  tls_certificates:
