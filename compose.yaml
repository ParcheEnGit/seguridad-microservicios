name: ${COMPOSE_PROJECT_NAME:-labsentinel}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init/01-create-keycloak-database.sh:/docker-entrypoint-initdb.d/01-create-keycloak-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./infra/keycloak/realm-labsentinel.json:/opt/keycloak/data/import/realm-labsentinel.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, frontend]
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_PROXY_API_TARGET: http://gateway
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT}:5173"
    networks: [frontend]

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      auth-service:
        condition: service_healthy
      device-service:
        condition: service_started
      telemetry-service:
        condition: service_started
      alert-ticket-service:
        condition: service_started
      report-service:
        condition: service_started
    networks: [frontend, backend]
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [backend, frontend]
    restart: unless-stopped

  device-service:
    build: ./services/device-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: device-service
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  telemetry-service:
    build: ./services/telemetry-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: telemetry-service
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  alert-ticket-service:
    build: ./services/alert-ticket-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: alert-ticket-service
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  report-service:
    build: ./services/report-service
    environment:
      APP_ENV: ${APP_ENV}
      SERVICE_NAME: report-service
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  simulator-device:
    build: ./services/simulator-device
    environment:
      APP_ENV: ${APP_ENV}
      TELEMETRY_URL: http://telemetry-service:8000/health
    depends_on:
      telemetry-service:
        condition: service_started
    networks: [backend]
    profiles: [simulator]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  frontend_node_modules:
