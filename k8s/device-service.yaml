apiVersion: v1
kind: Service
metadata:
  name: device-service
  namespace: labsentinel
spec:
  selector:
    app: device-service
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-service
  namespace: labsentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-service
  template:
    metadata:
      labels:
        app: device-service
        labsentinel/db-client: "true"
        labsentinel/egress: internal
    spec:
      containers:
        - name: device-service
          image: labsentinel-device-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: device-service
            - name: APP_ENV
              valueFrom: { secretKeyRef: { name: labsentinel-env, key: APP_ENV } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: labsentinel-env, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: labsentinel-env, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: labsentinel-env, key: POSTGRES_DB } }
            - name: DATABASE_URL
              value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: labsentinel-env, key: JWT_SECRET } }
            - name: CORS_ORIGINS
              valueFrom: { secretKeyRef: { name: labsentinel-env, key: CORS_ORIGINS } }
            - name: DEVICE_IMAGES_PATH
              value: /data/device-images
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            # Bajo carga /health puede tardar; se reinicia solo si no responde en ~90 s.
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: device-images
              mountPath: /data/device-images
      volumes:
        - name: device-images
          persistentVolumeClaim:
            claimName: device-images
