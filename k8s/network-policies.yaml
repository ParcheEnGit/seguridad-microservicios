# Equivalente a las redes de compose.yaml: solo el gateway y Keycloak (HTTPS)
# reciben tráfico externo, PostgreSQL acepta solo a sus clientes y los pods
# marcados con labsentinel/egress=internal no salen a Internet (red backend
# internal: true). k3s aplica estas políticas con su controlador integrado.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: labsentinel
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-anywhere
  namespace: labsentinel
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: labsentinel
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8443
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: keycloak-client-config
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-clients
  namespace: labsentinel
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              labsentinel/db-client: "true"
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-gateway
  namespace: labsentinel
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: 5173
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: microservices-from-gateway
  namespace: labsentinel
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth-service, device-service, alert-ticket-service, report-service]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: 8000
---
# telemetry-service recibe además las lecturas del simulador.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-from-gateway-and-simulator
  namespace: labsentinel
spec:
  podSelector:
    matchLabels:
      app: telemetry-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: simulator-device
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-egress-only
  namespace: labsentinel
spec:
  podSelector:
    matchLabels:
      labsentinel/egress: internal
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
